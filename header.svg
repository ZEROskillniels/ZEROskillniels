<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .terminal-bg { fill: #0d1117; stroke: #23d18b; stroke-width: 1; rx: 10; }
        .header-bar { fill: #161b22; rx: 10; }
        .ascii-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 10px; font-weight: bold; fill: #23d18b; }
        .cmd-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #c9d1d9; font-weight: bold; }
        .key-text { fill: #23d18b; font-weight: bold; }
        .val-text { fill: #c9d1d9; }
        .cursor { fill: #23d18b; animation: blink 1s step-end infinite; }
        
        @keyframes fadein {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
    
    <!-- Background -->
    <rect x="1" y="1" width="1198" height="648" class="terminal-bg" />
    <path d="M1 11 Q1 1 11 1 L1189 1 Q1199 1 1199 11 L1199 30 L1 30 Z" fill="#161b22" stroke="#23d18b" stroke-width="1"/>
    
    <!-- Window controls -->
    <circle cx="20" cy="15" r="6" fill="#ff5f56" />
    <circle cx="40" cy="15" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="15" r="6" fill="#27c93f" />
    
    <!-- Title -->
    <text x="600.0" y="20" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">~/profile.sh</text>

    <!-- Clip Paths for Typing Animation -->
    <defs>

        <clipPath id="clip-prompt">
            <rect x="650" y="65" width="0" height="25">
                <animate attributeName="width" from="0" to="500" begin="0.5s" dur="0.3s" fill="freeze" />
            </rect>
        </clipPath>

        <clipPath id="clip-line-0">
            <rect x="650" y="97" width="0" height="25">
