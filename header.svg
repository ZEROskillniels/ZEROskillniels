            </rect>
        </clipPath>

        <clipPath id="clip-line-7">
            <rect x="650" y="251" width="0" height="25">
                <animate attributeName="width" from="0" to="400" begin="1.8999999999999995s" dur="0.15s" fill="freeze" />
